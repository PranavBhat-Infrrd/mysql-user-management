replicaCount: 1

image:
  repository: PLACEHOLDER_ECR_REPO/mysql-user-mgmt
  tag: PLACEHOLDER_TAG
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: mysql-user-mgmt
  # No IRSA role -- this app makes no direct AWS API calls (pure TCP DB
  # client). Secrets are synced by the cluster's shared external-secrets
  # controller (its own role, not this app's), so no annotation needed here.
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3003

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dev
  host: mysql-user-mgmt.dev01-us-west-2.infrrd.cloud
  tlsSecret: mysql-user-mgmt-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# All DB credentials come from the shared /devops/shared/mysql/<ENV>/<FIELD> SSM
# parameters (one copy for the whole workspace, not per-app) -- see
# push-mysql-secrets step. Mapped here to the CONN_<ENV>_<FIELD> env var names
# this app's server/index.js actually reads.
externalSecrets:
  enabled: true
  secrets:
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/DEV/HOST
      name: CONN_DEV_HOST
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/DEV/PORT
      name: CONN_DEV_PORT
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/DEV/USER
      name: CONN_DEV_USER
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/DEV/PASSWORD
      name: CONN_DEV_PASSWORD
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/STAGING/HOST
      name: CONN_STAGING_HOST
    - key: /runtime/dev01-us-west-2/devops/shared/mysql/STAGING/PORT
